plugins { id 'com.android.application' }

android {
    namespace 'ai.zach.jetstorm'
    compileSdk 34

    defaultConfig {
        applicationId "ai.zach.jetstorm"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../jetstorm.keystore")
            storePassword "jetstorm"
            keyAlias "jetstorm"
            keyPassword "jetstorm"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
